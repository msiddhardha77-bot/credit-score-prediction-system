{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Register</h2>

                <form method="POST">

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   required>
                        </div>

                    </div>

                    <button class="btn btn-success w-100 mt-4">
                        Create Account
                    </button>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
